{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-3">
    {% for message in messages %}
        <div class="flash-alert flex items-center justify-between p-4 rounded-xl border backdrop-blur-sm transition-all duration-300
            {% if message.tags == 'success' %}
                bg-emerald-950/70 border-emerald-800 text-emerald-200
            {% elif message.tags == 'error' %}
                bg-rose-950/70 border-rose-800 text-rose-200
            {% elif message.tags == 'warning' %}
                bg-amber-950/70 border-amber-800 text-amber-200
            {% else %}
                bg-indigo-950/70 border-indigo-800 text-indigo-200
            {% endif %}">
            <div class="flex items-center space-x-3">
                {% if message.tags == 'success' %}
                    <svg class="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                {% elif message.tags == 'error' %}
                    <svg class="w-5 h-5 text-rose-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                {% else %}
                    <svg class="w-5 h-5 text-indigo-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                {% endif %}
                <span class="text-sm font-medium">{{ message }}</span>
            </div>
            <button type="button" data-dismiss="alert" class="p-1 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white transition">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    {% endfor %}
</div>
{% endif %}
