{% extends 'base.html' %}

{% block title %}Projeyi Sil — DevConnect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-xl">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-400 mb-5">
            <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2">Projeyi Silmek İstiyor Musunuz?</h1>
        <p class="text-slate-400 text-sm mb-6">
            <strong class="text-slate-200">"{{ project.title }}"</strong> projesi, ilişkili yorumlar ve beğeniler kalıcı olarak silinecektir. Bu işlem geri alınamaz.
        </p>

        <form method="POST" class="flex items-center justify-center space-x-4">
            {% csrf_token %}
            <a href="{% url 'projects:detail' project.slug %}" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition">
                Vazgeç
            </a>
            <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-md shadow-rose-600/30 transition">
                Evet, Projeyi Sil
            </button>
        </form>
    </div>
</div>
{% endblock %}
